plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.+'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}"
group = "net.commoble.${modid}" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base {
	archivesName = "${modid}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")

sourceSets
{
	main
}

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

neoForge {
	version = "${neo_version}"
	mods {
		"${modid}" {
			sourceSet(sourceSets.main)
		}
	}
	runs {
		client {
			client()
		}
		server {
			server()
		}
		gameTestServer {
			type = "gameTestServer"
		}
		configureEach {
			
		}
	}
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
}

repositories {
}

dependencies {
}

jar {
    manifest {
        attributes([
            "Specification-Title": "${modid}",
            "Specification-Vendor": "Commoble",
            "Specification-Version": "${version}",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"Commoble"
        ])
    }
}

java {
	withJavadocJar()
	withSourcesJar()
}

tasks.named("javadoc", Javadoc) {
	options.addBooleanOption("-no-fonts", true)
}

// run "gradlew build" to build the jars without mavening them
// run "gradlew build publishToMavenLocal" to publish to local maven
// to publish to remote maven, add mavenUsername and mavenPassword and url properties to USERHOME/.gradle/gradle.properties (in user folder, not project folder)
// run "gradlew build publish" to publish snapshot
// run "gradlew build -Prelease publish" to publish release
publishing {
	repositories {
		maven {
			def releasesRepoUrl = "${mavenReleasesUrl}"
			def snapshotsRepoUrl = "${mavenSnapshotsUrl}"
			url = project.hasProperty('release') ? releasesRepoUrl : snapshotsRepoUrl
			credentials {
				username = "${mavenUsername}"
				password = "${mavenPassword}"
			}
			authentication{ basic(BasicAuthentication) }
		}
	}
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
